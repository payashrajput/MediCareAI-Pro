{%extends 'base.html'%}{%block title%}Report Vault{%endblock%}{%block content%}<section class="pagehead"><small class="eyebrow">REPORT VAULT</small><h1>Keep reports <span>organized.</span></h1></section><section class="card"><form method="post" enctype="multipart/form-data"><label>PDF report or prescription<input type="file" name="document" accept="application/pdf" required></label><button class="btn primary">Upload & extract text →</button></form></section><div class="stack docs">{%for d in documents%}<article class="card"><div class="split"><b>▣ {{d.filename}}</b><small>{{d.created[:10]}}</small></div><details><summary>View extracted text</summary><pre>{{d.text}}</pre></details></article>{%else%}<p class="muted">No documents uploaded.</p>{%endfor%}</div>{%endblock%}
